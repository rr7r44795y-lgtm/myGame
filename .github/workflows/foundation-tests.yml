name: Foundation core tests
on:
  push:
    branches: ["feat/foundation-v2-supplies"]
  pull_request:
    paths: ["Assets/Foundation/**", "tools/**", ".github/workflows/foundation-tests.yml"]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C# test runtime
        run: sudo apt-get update && sudo apt-get install -y mono-mcs
      - name: Test foundation rules
        run: bash tools/test-foundation.sh
